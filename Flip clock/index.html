<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Flip Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    user-select: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    /* ─── ФОН ─── положи background.jpg рядом с index.html */
    background: url('background.jpg') center / cover no-repeat fixed;
    /* Если картинки нет — закомментируй строку выше и раскомментируй: */
    /* background: linear-gradient(135deg, #1e293b, #0f172a); */
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);   /* затемнение, чтобы цифры читались */
    pointer-events: none;
  }

  .clock {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .group { display: flex; gap: 8px; }

  .sep {
    color: #fff;
    font-size: 100px;
    font-weight: bold;
    line-height: 1;
    margin: 0 6px;
    text-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }

  /* ─── Одна цифра ─── */
  .digit {
    position: relative;
    width: 140px;
    height: 190px;
    perspective: 700px;
  }

  /* Каждая половинка — контейнер, обрезающий цифру */
  .half {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
  }

  /* Полная цифра внутри половинки — фикс. высота + центрирование */
  .num {
    position: absolute;
    left: 0;
    width: 100%;
    height: 190px;             /* полная высота цифры */
    display: flex;
    align-items: center;       /* центрируем текст вертикально */
    justify-content: center;
    font-size: 150px;
    font-weight: bold;
    color: #fff;
    line-height: 1;
  }

  /* ─── Верхние половинки: показываем верхние 95px цифры ─── */
  .half.top, .half.flip-top {
    top: 0;
    background: linear-gradient(#2c2c2c, #1a1a1a);
    border-radius: 12px 12px 0 0;
    border-bottom: 2px solid #000;
  }
  .half.top    .num,
  .half.flip-top .num { top: 0; }

  /* ─── Нижние половинки: сдвигаем цифру на -95px, показываем нижние 95px ─── */
  .half.bottom, .half.flip-bottom {
    bottom: 0;
    background: linear-gradient(#1a1a1a, #0a0a0a);
    border-radius: 0 0 12px 12px;
  }
  .half.bottom     .num,
  .half.flip-bottom .num { top: -95px; }

  /* ─── Анимируемые половинки ─── */
  .flip-top {
    transform-origin: bottom center;
    backface-visibility: hidden;
    z-index: 2;
  }
  .flip-bottom {
    transform-origin: top center;
    backface-visibility: hidden;
    transform: rotateX(90deg);
    z-index: 2;
  }

  .digit.flipping .flip-top    { animation: flipTop    0.30s ease-in  forwards; }
  .digit.flipping .flip-bottom { animation: flipBottom 0.30s ease-out 0.30s forwards; }

  @keyframes flipTop {
    from { transform: rotateX(0deg);   }
    to   { transform: rotateX(-90deg); }
  }
  @keyframes flipBottom {
    from { transform: rotateX(90deg); }
    to   { transform: rotateX(0deg);  }
  }
</style>
</head>
<body>
  <div class="clock" id="clock"></div>

<script>
  // ─── НАСТРОЙКИ ───
  const SHOW_SECONDS = true;   // показывать секунды
  const HOUR_24      = true;   // 24-часовой формат
  const SCALE        = 1;      // масштаб (0.5 … 2)

  // ─── Построение DOM ───
  const clock = document.getElementById('clock');
  clock.style.transform = `scale(${SCALE})`;

  const groups = SHOW_SECONDS ? ['h','m','s'] : ['h','m'];
  const digits = {};   // h0, h1, m0, m1, s0, s1

  groups.forEach((g, i) => {
    const grp = document.createElement('div');
    grp.className = 'group';

    for (let k = 0; k < 2; k++) {
      const d = document.createElement('div');
      d.className = 'digit';
      d.innerHTML =
        '<div class="half top">        <div class="num">0</div></div>' +
        '<div class="half bottom">     <div class="num">0</div></div>' +
        '<div class="half flip-top">   <div class="num">0</div></div>' +
        '<div class="half flip-bottom"><div class="num">0</div></div>';
      grp.appendChild(d);
      digits[g + k] = { el: d, value: '0', timer: null };
    }

    clock.appendChild(grp);

    if (i < groups.length - 1) {
      const sep = document.createElement('div');
      sep.className = 'sep';
      sep.textContent = ':';
      clock.appendChild(sep);
    }
  });

  // ─── Обновление одной цифры ───
  function setDigit(key, newValue) {
    const d = digits[key];
    if (d.value === newValue) return;

    const oldValue = d.value;
    d.value = newValue;

    // Верхняя половина уже показывает новое (появится, когда flip-top отлетит)
    d.el.querySelector('.top .num').textContent         = newValue;
    // Отлетающая половинка показывает старое
    d.el.querySelector('.flip-top .num').textContent    = oldValue;
    // Поднимающаяся половинка показывает новое
    d.el.querySelector('.flip-bottom .num').textContent = newValue;
    // .bottom пока оставляем со старым — обновим в середине анимации

    d.el.classList.remove('flipping');
    void d.el.offsetWidth;                    // reflow — перезапуск анимации
    d.el.classList.add('flipping');

    if (d.timer) clearTimeout(d.timer);
    d.timer = setTimeout(() => {
      d.el.querySelector('.bottom .num').textContent = newValue;
    }, 300);
  }

  const pad = n => n < 10 ? '0' + n : '' + n;

  // ─── Тик часов ───
  function tick() {
    const now = new Date();
    let h = now.getHours();
    if (!HOUR_24) h = h % 12 || 12;

    const hs = pad(h);
    setDigit('h0', hs[0]);
    setDigit('h1', hs[1]);

    const ms = pad(now.getMinutes());
    setDigit('m0', ms[0]);
    setDigit('m1', ms[1]);

    if (SHOW_SECONDS) {
      const ss = pad(now.getSeconds());
      setDigit('s0', ss[0]);
      setDigit('s1', ss[1]);
    }
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
